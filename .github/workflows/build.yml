name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Every build must be signed with the one permanent release key — an
      # APK signed with anything else can't be installed as an update over
      # the app already on the phone, which breaks the in-app updater.
      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$SIGNING_STORE_FILE"

      # Fails here (instead of deep inside Gradle) with a specific message if
      # a secret was pasted wrong. The SHA-256 of the keystore FILE is safe to
      # print and can be compared against the local copy.
      - name: Verify keystore and signing secrets
        run: |
          echo "keystore file sha256: $(sha256sum "$SIGNING_STORE_FILE" | cut -d' ' -f1)"
          if ! keytool -list -keystore "$SIGNING_STORE_FILE" -storepass "$SIGNING_STORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Keystore can't be opened: SIGNING_KEYSTORE_BASE64 is corrupted/truncated or SIGNING_STORE_PASSWORD is wrong"
            exit 1
          fi
          if ! keytool -list -keystore "$SIGNING_STORE_FILE" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore opened, but SIGNING_KEY_ALIAS ('$SIGNING_KEY_ALIAS') isn't in it — expected 'musicplayer'"
            exit 1
          fi
          if ! keytool -certreq -keystore "$SIGNING_STORE_FILE" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" -keypass "$SIGNING_KEY_PASSWORD" > /dev/null 2>&1; then
            echo "::error::SIGNING_KEY_PASSWORD is wrong (for this keystore it's the same as SIGNING_STORE_PASSWORD)"
            exit 1
          fi
          echo "Keystore, alias and key password OK"

      # Job logs need a GitHub login to read; annotations don't. On failure,
      # surface Gradle's "What went wrong" block as an annotation.
      - name: Build release APK
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee gradle-release.log; then
            msg=$(sed -n '/What went wrong/,/^\* Try/p' gradle-release.log | head -40 | awk '{printf "%s%%0A", $0}')
            [ -z "$msg" ] && msg=$(grep -E '^e: |error:|FAILED' gradle-release.log | head -20 | awk '{printf "%s%%0A", $0}')
            echo "::error title=assembleRelease failed::$msg"
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$SIGNING_STORE_FILE"
